services:

  postgres:
    image: postgres:16
    container_name: fitness-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fitness-micro-user
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fitness-network

  mongodb:
    image: mongo:7
    container_name: fitness-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - fitness-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: fitness-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fitness-network

  eureka:
    image: fitness/eureka-service:latest
    container_name: fitness-eureka
    ports:
      - "8761:8761"
    networks:
      - fitness-network

  configserver:
    image: fitness/config-service:latest
    container_name: fitness-configserver
    ports:
      - "8888:8888"
    depends_on:
      - eureka
    networks:
      - fitness-network

  userservice:
    image: fitness/user-service:latest
    container_name: fitness-user-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - eureka
      - configserver
    networks:
      - fitness-network

  activityservice:
    image: fitness/activity-service:latest
    container_name: fitness-activity-service
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
      - kafka
      - eureka
      - configserver
    networks:
      - fitness-network

  aiservice:
    image: fitness/ai-service:latest
    container_name: fitness-ai-service
    ports:
      - "8084:8084"
    depends_on:
      - mongodb
      - kafka
      - eureka
      - configserver
    environment:
      GEMINI_URL: ${GEMINI_URL}
      GEMINI_KEY: ${GEMINI_KEY}
    networks:
      - fitness-network

  gateway:
    image: fitness/gateway-service:latest
    container_name: fitness-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - configserver
      - userservice
      - activityservice
      - aiservice
    networks:
      - fitness-network

volumes:
  postgres-data:
  mongodb-data:
  kafka-data:

networks:
  fitness-network:
    driver: bridge