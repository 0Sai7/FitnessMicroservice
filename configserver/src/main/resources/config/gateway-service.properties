# --- Eureka ---
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# --- Server ---
server.port=8080

# --- CRITICAL: Correct Property Path for Spring Boot 4 WebFlux ---
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# --- Route Definition (Updated Path) ---
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=actvity-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ACTIVITY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.server.webflux.routes[2].id=ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/users/**

#----------resouce server oauth2=-----------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8181/realms/fitness-app/protocol/openid-connect/certs

# --- Logging ---
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.server.webflux=DEBUG

# --- Actuator (Must expose 'loggers' and 'gateway') ---
management.endpoints.web.exposure.include=health,info,loggers,gateway
management.endpoint.gateway.enabled=true   