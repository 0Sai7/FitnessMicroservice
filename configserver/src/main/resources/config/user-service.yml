spring:
  application:
    name: USER-SERVICE

  datasource:
    url: jdbc:postgresql://postgres:5432/fitness-micro-user
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update

    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/

server:
  port: 8083